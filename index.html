<!DOCTYPE html>
<html>
<head>
<title>Advanced Security System</title>

<style>
body{
background:black;
color:#00ff00;
font-family:monospace;
text-align:center;
margin-top:100px;
}

input{
padding:10px;
background:black;
border:1px solid #00ff00;
color:#00ff00;
}

button{
padding:10px 20px;
background:#00ff00;
border:none;
cursor:pointer;
}

#terminal{
margin-top:20px;
}
</style>
</head>

<body>

<h2>🔐 Secure Access Terminal</h2>

<input type="password" id="password" placeholder="Enter password">
<br><br>
<button onclick="login()">LOGIN</button>

<div id="terminal"></div>

<script>

// PASSWORD HASH (SHA-256)
async function hash(text){
const msgBuffer = new TextEncoder().encode(text);
const hashBuffer = await crypto.subtle.digest("SHA-256", msgBuffer);
const hashArray = Array.from(new Uint8Array(hashBuffer));
return hashArray.map(b => b.toString(16).padStart(2,"0")).join("");
}

// PASSWORD HASHED
const correctHash =
"240be518fabd2724ddb6f04eeb9d5d3f7c4c3f3d6d55f23a6d4e04d4e0c1a4f5";

let attempts = 0;
let locked = false;
let sessionToken = null;

// LOGIN SYSTEM
async function login(){

if(locked){
log("🚫 SYSTEM LOCKED");
return;
}

const pass = document.getElementById("password").value;
const passHash = await hash(pass);

if(passHash === correctHash){

sessionToken = generateToken();
log("✅ ACCESS GRANTED");
log("Session Token: " + sessionToken);

startSessionTimeout();

}else{

attempts++;
log("❌ WRONG PASSWORD");

if(attempts >= 3){
locked = true;
log("🚫 TOO MANY ATTEMPTS - SYSTEM LOCKED");
}

}

}

// TERMINAL OUTPUT
function log(text){
document.getElementById("terminal").innerHTML += "<br>> "+text;
}

// TOKEN GENERATOR
function generateToken(){
return Math.random().toString(36).substring(2) +
Math.random().toString(36).substring(2);
}

// SESSION TIMEOUT
function startSessionTimeout(){

setTimeout(()=>{

sessionToken = null;
log("⏳ SESSION EXPIRED");

},30000);

}

// DISABLE RIGHT CLICK
document.addEventListener("contextmenu", e=>e.preventDefault());

// BLOCK F12
document.onkeydown=function(e){
if(e.keyCode==123){
return false;
}
}

// DEVTOOLS DETECTOR
setInterval(function(){

if(window.outerWidth - window.innerWidth > 160){
log("⚠ Developer tools detected!");
}

},1000);

</script>

</body>
</html>
